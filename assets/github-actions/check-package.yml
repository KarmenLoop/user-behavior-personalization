# Optional template: copy to .github/workflows/check-package.yml to enable it.
name: "Check instruction package"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out source"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Check public package"
        run: python scripts/check_package.py
